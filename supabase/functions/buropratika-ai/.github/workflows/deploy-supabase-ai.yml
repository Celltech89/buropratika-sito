name: Deploy BuroPratika AI to Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/buropratika-ai/**'
      - '.github/workflows/deploy-supabase-ai.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy AI function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo 'Missing SUPABASE_ACCESS_TOKEN secret' && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo 'Missing SUPABASE_PROJECT_REF secret' && exit 1)
          supabase functions deploy buropratika-ai --project-ref "$SUPABASE_PROJECT_REF"
